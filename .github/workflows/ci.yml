name: CI

on:
  push:
    branches: [main]
    # 打 tag 时也要跑：发布流程要「等 CI 全绿」，tag 上没跑就没得等
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest 已经是 26.04，没有 3.9 的构建，钉住 22.04
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          # 最新的 3.x：本机 3.13.17 上全套测试是通过的，写进矩阵防止将来踩到
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 编译检查
        run: python -m compileall -q pcxray
      - name: 单元测试
        run: python -m unittest discover -s tests -t . -v

  smoke:
    name: 冒烟 · 真实系统上跑一遍
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装
        run: pip install -e .
      - name: 列自启（应该能找到东西，且不报错）
        run: pcxray list --limit 5
      - name: 看内存
        run: pcxray ram --limit 5
      - name: 不存在的名字必须被拒绝（返回非 0）
        run: |
          pcxray off 绝对不存在的条目名_xyz
          if ($LASTEXITCODE -eq 0) { exit 1 } else { exit 0 }
        shell: pwsh
      - name: 端到端自检（坏参数、--json 过滤、网页令牌）
        run: python scripts/ci_checks.py
